# _facts.yml — SINGLE SOURCE OF TRUTH for feature `e2e-harness`
# Every datum that appears in >1 doc lives HERE and is copied verbatim into prose.
# Companion file: docs/features/_profile.yml — one per REPO, not per feature.
# Editing a value here -> run `feature-spec sync e2e-harness` to propagate.
#
# STAGE 1. This file + 01-master-plan.md are the decision surface. Docs 02, 02e
# and 03 are written by `implement`, after `review` runs and `status:` flips to
# `reviewed`.
#
# THIS SET TESTS ANOTHER SET. The app under test is specified in
# docs/features/interstice/. Its facts are CITED from there, qualified, and never
# mirrored here: `docs/features/interstice/_facts.yml` acceptance.AC5, not a local
# copy. Ids in this file (C1, D1, AC1 ...) are this set's own and unrelated to the
# ids of the same shape over there.
#
# BASIS legend (references/evidence.md):
#   measured -> evidence: { how, cmd, date, value }
#   asserted -> falsified_by: <the observation that would kill it>
#   decided  -> a choice, not a claim about the world.

feature: e2e-harness
profile: docs/features/_profile.yml
title: 'E2E harness — scripted device runs of Interstice that end in an evidence report a judge can read'
status: implementing

owners:
  technical: 'César Rivas (CesarRivasP)'
  external: 'nobody with an ask. The reader outside the build is the hackathon judging
             panel, who receive the published report and owe nothing in return'

tracking:
  issues: []
  pr: null
  milestone: null
  branch: e2e-harness
  shipped_in: null
  blocked_by: null

dates:
  drafted: 2026-10-04
  revisions:
    - { tag: v1, date: 2026-10-04, note: 'initial decision draft — scope, capture ladder, two suites, fixture track, published report' }
    - { tag: v2, date: 2026-10-04, note: 'review R2 dispositions and owner confirmation — a launch id on the wire, fixtures addressed by collector state not by URL, a 60 s fixture asset so a stall can happen, the device restored to the Release package after a VARIANT run, published paths made relative; status draft -> reviewed' }
    - { tag: v3, date: 2026-10-04, note: 'verify R5 — Phase 0 ran on the Virtual Device: D1, D2, D3 and D5 hold; D4 is dead as written and fixed by keying the Metro cache on the flag (changes C24); the capture rung is grpc, the input route inputd-cli; status reviewed -> implementing' }
    - { tag: v4, date: 2026-10-04, note: 'build R6 — the harness is built and both suites ran on the Virtual Device: ten scenarios pass, one is blocked, and two fail on defects in the app (D8, D9); the report is generated into docs/e2e; fixture audio falls back to the host voice when Polly is unreachable' }

# =====================================================================
# DECISIONS
# =====================================================================
decisions:

  own_set:
    date: 2026-10-04
    basis: decided
    decided_by: 'owner, intake batch 2026-10-04'
    what: 'The harness is a spec set of its own, docs/features/e2e-harness/, with its own
           registry. It cites the app set (docs/features/interstice/) and never copies
           from it.'
    why: 'the app registry is 1927 lines and describes a product; this describes a tool
          that observes it. Folding one into the other would make every harness change
          an edit to the product registry.'
    cited_in: ['01 §2', '01 §3.3']

  trace_is_the_oracle:
    date: 2026-10-04
    basis: decided
    what: 'A scenario passes or fails on ASSERTIONS OVER THE BEACON TRACE and on nothing
           else. Screenshots and video are evidence for a human reader; they never decide
           a verdict.'
    why: 'three reasons, each already paid for once in the app set. (1) Focus can be
          visually right and natively wrong, so a picture does not prove where focus is.
          (2) The only documented screenshot route on the Virtual Device is reported to
          return a stale frame on every other call (limits.capture.appium_stale_frames).
          (3) The app already emits an INTERSTICE.* line at every state change the manual
          E2E reads, so the oracle exists; the harness reads it instead of inventing a
          second one from pixels.'
    cited_in: ['01 §2', '01 §3.1', '01 §8']

  capture_ladder:
    date: 2026-10-04
    basis: decided
    decided_by: 'owner, intake batch 2026-10-04'
    what: 'Screen capture sits behind one seam (changes C4) with three rungs, tried in
           order by the Phase 0 spike: (1) the emulator gRPC interface under the Virtual
           Device — screenshot, video, possibly audio; (2) Appium with the Vega driver;
           (3) no pixels at all, the report built from traces and rendered timelines.
           The harness runs on any rung. The rung in use is recorded in every run.'
    why: 'the Vega CLI has no screenshot command (limits.capture.cli_has_no_screenshot)
          and the two documented routes are unsupported or unreliable on this image.
          A ladder means the harness never waits on a tool: rung 3 needs nothing new.'
    cited_in: ['01 §2', '01 §3.1', '01 §3.2', '01 §8']

  two_suites:
    date: 2026-10-04
    basis: decided
    what: 'Two suites, and the report never mixes them. RELEASE runs against the
           unmodified Release package — the binary that is submitted — with no fixture
           and no fault injection. VARIANT runs against a build made with the
           INTERSTICE_E2E flag, which lets the harness serve track files, cue audio and
           media segments from the host and therefore break them on purpose.'
    why: 'a test build is not the shipped build. Saying so per scenario costs one column
          in the report; not saying so is the kind of claim a careful judge discounts
          wholesale. The flag is BUILD-TIME so the Release package carries no code path
          that loads content from localhost (alternatives A3).'
    cited_in: ['01 §2', '01 §3.1', '01 §5', '01 §7']

  fixture_track:
    date: 2026-10-04
    basis: decided
    decided_by: 'owner, 2026-10-04 — asked for a recommendation at intake, was given this
                 one with its limit stated, and confirmed it'
    revised_on: 2026-10-04
    what: 'While `docs/features/interstice/_facts.yml` defects.D4 keeps the real track
           from existing, VARIANT scenarios run against a FIXTURE track: asset id
           `e2e-fixture`, cue windows declared by the fixture itself, cue text of the form
           "Fixture cue N", audio synthesised by Polly through the pipeline the app set
           already has. The fixture is served from the host at run time, is never
           inside any package, never appears in the demo or the submission video, and
           every result that used it is labelled FIXTURE wherever it is shown.
           THE VOICE IS POLLY WHEN IT ANSWERS AND THE HOST''S OWN `say` WHEN IT DOES
           NOT (built R6: the AWS session had expired, and a suite that needs a cloud
           login to say "Fixture cue one" is a suite a judge cannot run). Same
           container either way.
           THE FIXTURE ASSET IS ITS OWN MEDIA TOO (review R2-F5): the first
           limits.fixture.duration_s seconds of the film, cut and segmented on the host
           by the pipeline the app set already has, and served like the track. The
           packaged 20 s clip cannot stall — every segment of it sits inside the buffer
           window and is fetched before playback starts.'
    why: 'the scheduler, the toggle, the verbosity switch and the failure states are the
          app, and they can be shown working today; only the WORDS wait on Bedrock.
          `docs/features/interstice/_facts.yml` acceptance.AC7 forbids hand-written cue
          text in the PRODUCT track; a labelled test fixture that never ships is a
          different object, and the label is what keeps it one. When D4 clears, the
          same scenarios run against the real track and the label goes.'
    what_it_does_not_show: 'that a cue avoids DIALOGUE. Fixture windows are declared, not
          derived from subtitles, so a pass means "the cue stayed inside its window",
          which is half of `docs/features/interstice/_facts.yml` acceptance.AC4. The
          report says which half.'
    cited_in: ['01 §2', '01 §3.1', '01 §7', '01 §8']

  host_served_fixtures:
    date: 2026-10-04
    basis: decided
    what: 'One host process (changes C5) listens on the beacon port and does two jobs:
           receives trace lines, and serves fixture files under endpoints.fixtures. A
           fault is a property of what that server returns for one scenario — a 404, a
           truncated body, a segment withheld for N seconds — not an edit to the app.'
    why: 'the device already reverse-forwards one port to the host for the beacon, and
          JavaScript on the device reaches it. Reusing it adds no port, no second
          forwarding step and no file inside the package.'
    cited_in: ['01 §3.1', '01 §4', '01 §5']

  ac_text_read_not_copied:
    date: 2026-10-04
    basis: decided
    what: 'The report prints each app acceptance criterion by READING
           docs/features/interstice/_facts.yml at build time. No criterion text is typed
           into the harness, a scenario, or this registry. A scenario names the ids it
           covers and nothing more.'
    why: 'a copied criterion drifts, and this one would drift in the document handed to
          the people scoring the project. Same mechanism as the app set contract-parity
          test.'
    cited_in: ['01 §3.1', '01 §4']

  verdict_vocabulary:
    date: 2026-10-04
    basis: decided
    what: 'Exactly four verdicts: pass | fail | blocked | skipped. `blocked` requires
           `blocked_by:` naming a registry id or a missing capability, and is rendered as
           prominently as a failure. `skipped` is only ever set by the person running the
           suite, with a filter. A run whose trace has a gap in its sequence numbers is
           `fail` with reason `trace_incomplete`, whatever its assertions said.'
    why: 'a scenario that could not run and one that ran green look identical in a list
          of ticks unless the vocabulary separates them. Three criteria of the app close
          on hardware only and one scenario has no input path; a report that shows them
          as anything but blocked overstates what was measured.'
    cited_in: ['01 §2', '01 §4', '01 §7']

  report_static_pages:
    date: 2026-10-04
    basis: decided
    decided_by: 'owner, intake batch 2026-10-04'
    what: 'The report is static HTML generated into docs/e2e/, committed, and served by
           GitHub Pages from the /docs folder of the main branch. One run per suite is published at
           a time, chosen explicitly with `npm run e2e:publish`, which COPIES the run
           record, its traces and its captures into docs/e2e/run/<suite>/ — every path in a run
           record is relative to its run directory, so the copy is the whole run
           (review R2-F8). e2e/out/ is ignored by git. The report can be rebuilt from its committed run record with no device.
           Turning Pages on is a repository setting the owner changes by hand.'
    why: 'judges open a link, not a terminal. A committed report is also dated by git,
          which is the same argument the friction log rests on.'
    cited_in: ['01 §2', '01 §3.1', '01 §3.2', '01 §6', '01 §7']

  timebox:
    date: 2026-10-04
    basis: decided
    decided_by: 'owner, 2026-10-04 — proposed by the authoring agent and confirmed'
    what: 'Four phases inside 2026-10-05 .. 2026-10-12, sized in working sessions rather
           than hours: Phase 0 spike gate (one session), Phase 1 RELEASE suite plus a
           first report (two), Phase 2 VARIANT build, fixtures and fault scenarios (two),
           Phase 3 report finish, publication and the friction-log entries (one).
           ORDER OF SACRIFICE if it runs long: S18 goes first, then video capture
           (screenshots stay), then the timeline strip, then Phase 2 as a whole — the
           RELEASE suite and its report are the floor and never yield.'
    why: 'the submission closes on 2026-10-23 12:00 PT and the app set still owes the
          video, the submission text and a validation session due 2026-10-16. A harness
          that eats that time has cost more than it shows. No hour figure is given
          because none has been measured.'
    cited_in: ['01 §3.2', '01 §8']

# =====================================================================
# DOMAIN FACTS
# =====================================================================
limits:

  capture:
    cli_has_no_screenshot:
      basis: measured
      evidence: { how: shell, date: 2026-10-04,
                  cmd: 'vega --version && vega device --help',
                  value: 'Active SDK Version: 0.24.12112, Vega CLI Version: 1.3.4; 25 device
                          subcommands listed, none of them a screenshot, a screen record or
                          a key press' }
    gwsi_not_on_virtual_device:
      basis: asserted
      source: 'https://community.amazondeveloper.com/t/vega-cli-commands-to-take-a-screenshot-and-press-remote-keys/29258'
      what: 'gwsi-tool-screenshooter is for a Fire TV Stick; on the Virtual Device it writes
             a 0-byte file or hangs. Consistent with what the app set measured on
             2026-09-25, where it failed for a different stated reason.'
      falsified_by: 'a non-empty PNG written by gwsi-tool-screenshooter on this Virtual Device'
    appium_stale_frames:
      basis: asserted
      source: 'https://community.amazondeveloper.com/t/vega-sdk-0-24-vvd-automation-toolkit-crashes-on-every-takescreenshot-econnreset-then-dies-after-3-calls-until-reboot/29134'
      what: 'On SDK 0.24.12112 the automation toolkit no longer crashes on takeScreenshot,
             but inside an app it returns a stale frame on every other call. Reported by a
             third party on 2026-09-24 with a repro; Amazon acknowledged and is
             investigating. Also reported: the Vega Appium driver needs Node 22 or earlier.'
      falsified_by: 'two consecutive Appium screenshots after a key press that both show the
                     new state, on this machine'
    host_node:
      basis: measured
      evidence: { how: shell, date: 2026-10-04, cmd: 'node -v', value: 'v24.16.0' }
      note: 'above the Node ceiling reported for the Appium driver, so rung 2 of
             decisions.capture_ladder would need a second Node install.'
    emulator_grpc:
      basis: asserted
      source: 'same thread as appium_stale_frames, post of 2026-09-28'
      what: 'The emulator under the Virtual Device exposes a gRPC interface
             (EmulatorController: sendKey, getScreenshot) once its console is sent
             `grpc <port>`. A third party polled getScreenshot 168 times in 4 s on SDK
             0.24.12112 inside an RN 0.83 app and got 8 distinct frames, each at a real
             change, with no stale alternation. Their wrapper,
             github.com/fortemate/vega-vvd-driver, is unofficial and also claims video
             with sound. UNDOCUMENTED BY AMAZON and Virtual Device only.'
      falsified_by: 'the console refusing `grpc <port>` on this machine, or getScreenshot
                     returning an empty or unchanged frame after a key press — defects D1'
    wrapper_license: 'MIT — read from its LICENSE on 2026-10-04, at commit a9ea5d5f9853806c65d2a4c9ad4dc71c632b8d8b, version 0.2.2'
    wrapper_license_note: 'installed as an exact devDependency, @fortemate/vega-vvd-driver 0.2.2,
             with --ignore-scripts; the source read was that of commit a9ea5d5, whose
             package.json carries the same version. Its package name is
             @fortemate/vega-vvd-driver. Before running it the source was read for what it
             reaches: the emulator console and gRPC endpoint on 127.0.0.1, and ffmpeg as a
             child process. Nothing else. Installed with --ignore-scripts.'
    frame_size:
      basis: measured
      evidence: { how: shell, date: 2026-10-04, cmd: 'ls -l on three captures; ffmpeg -vf scale=1280:-1 -q:v 4 on the largest',
                  value: 'PNG 1920x1080: 26811 bytes (text on black) to 1359373 bytes (a film frame). The same film frame as a 1280-wide JPEG: 76077 bytes.' }
      note: 'a film frame as PNG is four times limits.report.max_screenshot_kb. Captures are
             therefore stored as 1280-wide JPEG, converted at capture time.'

  input:
    inputd_cli:
      basis: asserted
      what: 'Remote keys are injected with `vega device run-cmd -c "inputd-cli button_press
             KEY_*"`. The app set MEASURED this reaching the app on 2026-09-25
             (`docs/features/interstice/_facts.yml` limits.vega_media.input_injection), and
             a third party reported on 2026-09-30 that it reports success and never reaches
             an app. Two observations that disagree, so it is asserted here until it is
             re-measured on today''s image — defects D2.'
      falsified_by: 'KEY_ENTER on the title list producing no INTERSTICE.app.play line'
    fallback: 'EmulatorController.sendKey, if defects D1 holds and defects D2 does not'

  trace:
    transport: 'one HTTP GET per line from src/diagnostics.ts to the host, fire and forget'
    ordering:
      basis: asserted
      what: 'Arrival order is not emission order: each line is an independent request with
             no await, and the collector stamps host time on arrival. Two lines emitted
             2 ms apart can arrive swapped, and a dropped request leaves no trace of itself.'
      falsified_by: '1000 consecutive lines arriving with strictly increasing seq and no
                     gap, on three runs'
    consequence: 'every line carries a launch id, a sequence number within that launch,
                  and a device clock reading (contracts.beacon_query). The collector
                  orders by seq within a launch. A gap in seq, or a launch whose first
                  seq is not 0, makes the run trace_incomplete
                  (decisions.verdict_vocabulary). The runner opens every run with a CANARY
                  launch and requires its seq 0 to arrive before any scenario starts, so
                  a missing seq 0 inside a scenario is never the forwarding not being
                  up yet. No canary line: every scenario is blocked, naming that.'
    trailing_loss: 'lines in flight when the app is terminated can be lost with nothing
                  after them to reveal the gap. Accepted: a lost trailing line can only
                  turn a pass into a fail, never the reverse, because every scenario
                  asserts on lines it must SEE.'
    new_lines:
      basis: decided
      app_mode: 'INTERSTICE.app.mode e2e=<true|false> host=<origin|none> — src/App.tsx, at module load, both builds'
      player_progress: 'INTERSTICE.player.progress pos_ms=<integer> — src/screens/PlayerScreen.tsx, at most one per limits.timing.progress_interval_ms'
      overlay_shown: 'INTERSTICE.overlay.shown status=<loading|stalled|error> spoken=<the sentence> — src/screens/PlayerScreen.tsx'
      overlay_cleared: 'INTERSTICE.overlay.cleared — src/screens/PlayerScreen.tsx, when status returns to playing'
      ad_state: 'INTERSTICE.ad.state kind=<ready|missing|malformed> enabled=<bool> verbosity=<level> cues=<n> — src/screens/PlayerScreen.tsx; enabled, verbosity and cues only when kind=ready'
      note: 'the package line controls.announce carries the KIND of what was spoken and not
             the sentence. ad.state carries the whole state, so the report can produce the
             sentence with the package''s own stateMessage rather than a copy of its text.'
    no_position_line:
      basis: measured
      evidence: { how: shell, date: 2026-10-04,
                  cmd: 'rg -n "player.progress" src ~/Documents/work/build_future/react-native-tv-audio-description/src',
                  value: 'no matches' }
      note: 'nothing in the app or the package emits the playhead periodically. "The film
             kept playing while X happened" is therefore unassertable today — the absence
             of a stall line is not evidence of playback. changes C15 adds the emitter.'

  timing:
    basis: decided
    wait_for_line_ms: 15000
    scenario_timeout_ms: 90000
    stall_wait_ms: 60000
    window_tolerance_ms: 300
    key_gap_ms: 300
    progress_interval_ms: 1000
    note: 'starting values, tuned against the first real runs and then re-recorded here.
           The demo clip is 20 s, so 90 s bounds launch, a full play and teardown.'

  report:
    basis: decided
    published_dir: docs/e2e
    max_total_mb: 25
    max_screenshot_kb: 300
    max_clip_s: 12
    max_clip_mb: 3
    attribution: '(CC) Blender Foundation | mango.blender.org'
    note: 'the film on screen is Tears of Steel, CC-BY; every page that shows a frame of
           it carries the attribution. The size bounds exist because the report is
           committed: an unbounded video per scenario per publish is how a repository a
           judge must clone reaches a gigabyte.'

  fixture:
    basis: decided
    asset_id: e2e-fixture
    title_label: 'E2E FIXTURE — not a film'
    duration_s: 60
    cue_windows_ms: [[4000, 9000], [14000, 20000], [24000, 28000]]
    withheld_segment_from_ms: 31000
    note: 'duration_s must exceed the package buffer window of 30 s ahead, or no segment
           is ever fetched during playback and S15 cannot stall (review R2-F5). The cue
           windows are DECLARED, not derived from subtitles, and all three end before
           30 s so cue scenarios finish inside one scenario timeout. The first segment
           starting at or after withheld_segment_from_ms is the one S15 withholds: it
           must start more than 30 s in, or it is fetched before playback begins.
           concise carries the first two windows only; standard and detailed carry all
           three. So concise and standard load different cue counts, as the real
           tracks do, and S12 removes the detailed file to show the fallback.'

  suite:
    basis: decided
    release: [S01, S02, S03, S04, S05]
    variant: [S10, S11, S12, S13, S14, S15, S16, S17, S18]
    note: 'ids are stable and never recycled. Each scenario names the app criteria it
           covers by id only (decisions.ac_text_read_not_copied); `covers` below refers to
           `docs/features/interstice/_facts.yml` acceptance[].'
    scenarios:
      - { id: S01, name: launch-and-list, suite: release, covers: [AC1, AC2],
          use_case: 'the viewer opens the app and lands on the title list with a title focused',
          decisive: 'INTERSTICE.app.mode e2e=false, INTERSTICE.asset.segments with n > 0 and init=set; ENTER then yields INTERSTICE.app.play' }
      - { id: S02, name: play-to-end, suite: release, covers: [AC1],
          use_case: 'the viewer plays the demo clip from start to finish',
          decisive: 'player.opened, one buffer.appended per segment, buffer.complete, player.play resolved, player.progress advancing to the end, and buffer.evicted EXACTLY once' }
      - { id: S03, name: probe-cue-ducks, suite: release, covers: [AC5],
          use_case: 'a description cue speaks over the film and the film comes back to full',
          decisive: 'cue.fire, audio.duck to_pct=25, cue.audio state=ended, audio.restored, in that order, with player.progress advancing between duck and restore' }
      - { id: S04, name: back-returns-to-list, suite: release, covers: [AC2],
          use_case: 'the viewer presses BACK during playback and is on the list again, able to start over',
          decisive: 'player.back from=playing, then a second ENTER yields a second app.play' }
      - { id: S05, name: no-track-is-stated, suite: release, covers: [AC8],
          use_case: 'the title has no description track; the app says so and the film plays anyway',
          decisive: 'loader.miss, controls.announce kind=missing, and player.progress still advancing afterwards' }
      - { id: S10, name: cues-stay-in-window, suite: variant, covers: [AC4], fixture: true,
          use_case: 'three cues each start and finish inside their window',
          decisive: 'per cue: audio.duck at a position inside the window and audio.restored before its end' }
      - { id: S11, name: toggle-off-and-on, suite: variant, covers: [AC3], fixture: true,
          use_case: 'the viewer switches description off mid-film and back on; the film never stops',
          decisive: 'controls.toggle to=false, no audio.duck while off, no player.stalled, controls.toggle to=true, the NEXT cue fires and the missed one does not' }
      - { id: S12, name: verbosity-switch, suite: variant, covers: [AC17], fixture: true,
          use_case: 'the viewer moves between concise, standard and detailed while watching',
          decisive: 'controls.verbosity to=concise then loader.load ok=true with fewer cues than standard loaded; controls.verbosity to=detailed, whose file is absent, yielding loader.miss for it and then loader.load for standard' }
      - { id: S13, name: malformed-track-is-stated, suite: variant, covers: [AC8], fixture: true,
          use_case: 'the track file is corrupt; the app says something different from "missing" and the film plays',
          decisive: 'loader.load ok=false carrying a reason, then controls.announce kind=malformed, and player.progress still advancing' }
      - { id: S14, name: failed-cue-restores-volume, suite: variant, covers: [AC5], fixture: true,
          use_case: 'one cue has no audio; the film must not be left quiet',
          decisive: 'audio.failed for that cue followed by audio.restored for it' }
      - { id: S15, name: stall-and-recover, suite: variant, covers: [AC24], fixture: true,
          use_case: 'the bytes run short mid-film; the viewer is told, and playback resumes when they arrive',
          decisive: 'player.stalled after player.progress has passed 30000, then player.resumed from=stalled once the withheld segment is served',
          note: 'the collector HOLDS the response until the runner releases it, which it does only after seeing player.stalled. A timed delay would not do: the buffer runs 30 s ahead of the playhead, so a segment delayed by a few seconds arrives long before it is needed' }
      - { id: S16, name: error-state-has-a-way-out, suite: variant, covers: [AC2], fixture: true,
          use_case: 'the title cannot be opened; the viewer is told and BACK still works',
          decisive: 'player.open failed or player.error, then player.back from=error',
          note: 'the fault is a DROPPED CONNECTION on the init segment. A 404 would not do: the package never checks response.ok, so a 404 body is appended as media (review R2-F6)' }
      - { id: S17, name: held-seek-coalesces, suite: variant, covers: [AC6], fixture: true,
          blocked_by: D6,
          use_case: 'the viewer holds a direction to seek; the scheduler resyncs once',
          decisive: 'scheduler.coalesced exactly once with events > 1' }
      - { id: S18, name: long-asset-evicts, suite: variant, covers: [AC23], fixture: false, stretch: true,
          deferred: true, reopens_when: 'Phases 0 to 3 close before 2026-10-12',
          use_case: 'a feature-length film plays without the buffer growing',
          decisive: 'buffer.evicted repeatedly with held= bounded',
          note: 'Virtual Device only. It supports the criterion and cannot close it: the
                 criterion names the worst device in the matrix.' }

  coverage:
    basis: decided
    note: 'how each criterion of the app is classed by this harness. The report renders
           this table with the criterion text read from the app registry. Ids refer to
           `docs/features/interstice/_facts.yml` acceptance[]. Classes: automated (RELEASE
           suite) | fixture (VARIANT suite) | blocked | hardware | manual | out_of_scope.'
    classes:
      AC1: automated
      AC2: automated
      AC3: fixture
      AC4: fixture
      AC5: automated
      AC6: blocked
      AC7: out_of_scope
      AC8: automated
      AC9: out_of_scope
      AC10: out_of_scope
      AC11: out_of_scope
