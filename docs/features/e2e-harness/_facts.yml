# =====================================================================
# HYPOTHESES — every one is answered in Phase 0, before anything is built on it
# =====================================================================
defects:

  - id: D1
    role: blocking
    claim: 'The emulator gRPC interface can be enabled on this Virtual Device and returns
            a current screenshot after a key press.'
    basis: measured
    evidence: { how: device, date: 2026-10-04, n: 2,
                spread: 'both runs the same: three frames, each showing the current screen',
                cmd: 'vvd enable-grpc; vvd screenshot 1.png; inputd-cli button_press KEY_ENTER; (5 s) vvd screenshot 2.png; (2 s) vvd screenshot 3.png — R-VVD-DRIVER at commit a9ea5d5',
                conditions: { target_platform: 'Vega Virtual Device, vvrp-tv-arm64, aarch64, OS 1.2 (TV Ship/102282480), simulated', build: 'Release aarch64, SDK 0.24.12112, Vega CLI 1.3.4', content_asset: 'clip: 20 s of Tears of Steel, 4 segments' },
                value: 'gRPC is on at port 8554. Three PNGs of 1920x1080: the title list (26811 bytes), the film playing 5 s after INTERSTICE.app.play (1359373 bytes), a later film frame (54421 bytes). Three different md5. No stale frame. Second run on the flagged build: the two-title list, then the film.' }
    falsified_by: 'the emulator console refusing `grpc <port>`, or a screenshot taken
                   after KEY_ENTER on the title list that still shows the list'
    log_line: 'INTERSTICE.app.play id=<title> — the trace line that says the screen SHOULD have changed, against which the frame is compared'
    status: fixed
    outcome: 'holds. capture_rung is grpc.'
    if_false: 'rung 2 of decisions.capture_ladder, then rung 3. Nothing else changes.'

  - id: D2
    role: blocking
    claim: 'inputd-cli button_press reaches the app on the current Virtual Device image.'
    basis: measured
    evidence: { how: device, date: 2026-10-04, n: 6,
                spread: 'six presses, six lines: KEY_ENTER x3, KEY_BACK x2, KEY_DOWN then KEY_ENTER x1',
                cmd: 'vega device run-cmd -c ''inputd-cli button_press KEY_ENTER'' (and KEY_BACK, KEY_DOWN), reading the beacon',
                conditions: { target_platform: 'Vega Virtual Device, vvrp-tv-arm64, aarch64, OS 1.2 (TV Ship/102282480), simulated', build: 'Release aarch64, SDK 0.24.12112, Vega CLI 1.3.4', content_asset: 'clip: 20 s of Tears of Steel, 4 segments' },
                value: 'KEY_ENTER on the list -> INTERSTICE.app.play id=tears-of-steel; KEY_BACK in the player -> INTERSTICE.player.back from=playing; KEY_DOWN then KEY_ENTER on the flagged build -> INTERSTICE.app.play id=e2e-fixture. The CLI prints "Injecting Button Press As Driver: KEY_ENTER State: short".' }
    falsified_by: 'KEY_ENTER on the title list producing no INTERSTICE.app.play line within limits.timing.wait_for_line_ms'
    log_line: 'INTERSTICE.app.play id=<title> — src/App.tsx, the Pressable onPress'
    status: fixed
    outcome: 'holds. input_route is inputd-cli. The third-party report that it never reaches an app (R-THREAD-CLI, and the README of R-VVD-DRIVER) does not reproduce here, on the same SDK and OS build; what differs between the two apps was not investigated. inputd-cli also offers repeat and --holdDuration, read from its own usage text and not exercised.'
    if_false: 'limits.input.fallback. If D1 is false as well, there is no automation on this image and the set stops at Phase 0 with that recorded.'

  - id: D3
    role: contributing
    claim: 'The gRPC interface can record a clip of the Virtual Device WITH ITS AUDIO.'
    basis: measured
    evidence: { how: device, date: 2026-10-04, n: 1, spread: 'single run',
                cmd: 'vvd record s03.mp4 --seconds 12 (started 1.5 s before KEY_ENTER); ffprobe -show_streams; ffmpeg -af volumedetect; ffmpeg -af astats per 0.5 s',
                conditions: { target_platform: 'Vega Virtual Device, vvrp-tv-arm64, aarch64, OS 1.2 (TV Ship/102282480), simulated', build: 'Release aarch64, SDK 0.24.12112, Vega CLI 1.3.4', content_asset: 'clip: 20 s of Tears of Steel, 4 segments' },
                value: 'h264 1920x1080 + aac 44100 Hz, 12.0 s, 1541995 bytes; "360 frames, 10.3 s of audio"; mean_volume -14.4 dB, max_volume -0.4 dB; digital silence before playback starts, then signal from 4.5 s to 11.5 s. The trace of the same run: audio.duck at 16:02:26.574, cue.audio state=ended at 16:02:28.973, audio.restored at 16:02:29.202.' }
    falsified_by: 'a recorded clip of S03 with a silent audio stream, or no audio stream'
    log_line: 'INTERSTICE.audio.duck id=<cue> to_pct=25 and INTERSTICE.audio.restored id=<cue> — the two instants between which the recorded level must drop'
    status: fixed
    outcome: 'holds: the clip carries the device audio. WHAT THIS DOES NOT YET SHOW is the duck itself. In this one recording the cue speaks over the film''s opening, which is itself rising in level, so the mix cannot be read as "the film got quieter". That needs a controlled pair — the same seconds of film recorded once with the cue and once without — and is a scenario to add, not a conclusion to draw from this run.'
    note: 'worth a hypothesis of its own because of what it would overturn: the app set
           records that there is NO audio capture path off the Virtual Device
           (`docs/features/interstice/_facts.yml` limits.vega_media.concurrent_streams),
           and that is why audible ducking closes on hardware only. Sound in a recording
           would not be a listener, but a measured drop in level between two trace
           instants is evidence that set does not have.'
    if_false: 'no change. Audible ducking stays hardware-only, as it is today.'

  - id: D4
    role: blocking
    claim: 'An environment variable set for `react-native build-vega` can be made visible
            to the bundle as a constant, so one source tree yields both packages.'
    basis: measured
    evidence: { how: device, date: 2026-10-04, n: 9,
                spread: 'WITHOUT changes C24: 4 alternating builds (flagged, release, flagged, release), all four launched as e2e=true. WITH it: 5 alternating builds (release, flagged, release, flagged, release), all five correct.',
                cmd: 'INTERSTICE_E2E=http://localhost:8099 npx react-native build-vega --build-type Release | npm run build, alternated with nothing cleaned; install; launch; read INTERSTICE.app.mode',
                conditions: { target_platform: 'Vega Virtual Device, vvrp-tv-arm64, aarch64, OS 1.2 (TV Ship/102282480), simulated', build: 'Release aarch64, SDK 0.24.12112, Vega CLI 1.3.4', content_asset: 'clip: 20 s of Tears of Steel, 4 segments' },
                value: 'with the babel plugin alone, a Release build made after a flagged one launched as INTERSTICE.app.mode e2e=true host=http://localhost:8099 — the transform cache does not key on the environment, so the SUBMITTED package would have carried the test host. With cacheVersion in metro.config.js set from the same variable: e2e=false, true, false, true, false.' }
    falsified_by: 'a build made with INTERSTICE_E2E set whose trace opens with INTERSTICE.app.mode e2e=false'
    log_line: 'INTERSTICE.app.mode e2e=<bool> host=<host|none> — src/App.tsx at module load; must be built (changes C14)'
    status: fixed
    outcome: 'the claim holds ONLY with changes C24. The babel plugin alone compiles the constant correctly once and then the cache serves it to every later build, in whichever direction is wrong. This is the failure 02 Phase 0.4 step 3 was written to catch, and it caught it on the first try.'
    if_false: 'the flag becomes a generated module written before the build and restored after, which works on any bundler and is uglier.'

  - id: D5
    role: blocking
    claim: 'JavaScript on the device can fetch a track file, a cue clip and a media segment
            from the host over the reverse-forwarded beacon port, and the bytes play through
            MediaSource exactly as packaged ones do.'
    basis: measured
    evidence: { how: device, date: 2026-10-04, n: 1, spread: 'single run',
                cmd: 'flagged build; a host server on 8099 answering both the beacon and /fx/; KEY_DOWN, KEY_ENTER; read both logs',
                conditions: { target_platform: 'Vega Virtual Device, vvrp-tv-arm64, aarch64, OS 1.2 (TV Ship/102282480), simulated', build: 'Release aarch64 + INTERSTICE_E2E, SDK 0.24.12112, Vega CLI 1.3.4', content_asset: 'the 20 s clip''s own init + 4 segments, served from the host' },
                value: 'FX 200 /fx/asset.json; FX 200 /fx/seg/init.mp4 and each of seg0000..seg0003.m4s, each followed by INTERSTICE.buffer.appended with the same byte counts as the packaged run (1343, 649534, 1037183, 856989, 83877); buffer.complete segments=4; player.play resolved; resumed from=stalled; a screenshot shows the film. FX 404 /fx/e2e-fixture.standard.track.json -> INTERSTICE.loader.miss with that path.' }
    falsified_by: 'INTERSTICE.loader.miss for a fixture path the server logged as served, or INTERSTICE.buffer.failed on a host-served segment'
    log_line: 'INTERSTICE.loader.miss path=<path> — the package TrackLoader; INTERSTICE.buffer.appended <label> bytes=<n> — the package SegmentBuffer'
    status: fixed
    outcome: 'holds for the track path, media segments and — seen in the first VARIANT run — cue audio: three host-served clips played, each inside its window (S10).'
    note: 'half of this is already measured by the app set: on 2026-09-22 device
           JavaScript fetched a 200 from the host over reverse forwarding
           (`docs/features/interstice/_facts.yml` limits.vega_media.media_process_is_separate).
           What is new is feeding those bytes to MediaSource, which is how the app plays
           everything since URL mode was found broken.'
    if_false: 'fixtures travel inside the VARIANT package instead; fault scenarios that need a live server (S15) are blocked.'

  - id: D6
    role: blocking
    claim: 'The app has no input path that seeks. No key handler changes the playhead, in
            the app or in the package it consumes.'
    basis: measured
    evidence: { how: shell, date: 2026-10-04,
                cmd: 'rg -n "currentTime = " src ~/Documents/work/build_future/react-native-tv-audio-description/src -g "*.ts" -g "*.tsx"',
                value: 'no matches. Run the same way for seekTo, useTVEventHandler and onKey, one symbol per command: no matches each. The adapter in the package LISTENS for the seeked event (its vega entry, onSeek) and nothing causes one.' }
    log_line: 'INTERSTICE.scheduler.coalesced events=<n> settled_ms=<ms> — the package CueScheduler; it cannot fire without a seek'
    status: open
    owned_by: 'docs/features/interstice/ — the fix is a seek control in the app, not anything in this set'
    note_ownership: 'open here because it blocks S17. It also means the manual step C.4 of
           `docs/features/interstice/02e-tests-and-done.md` ("hold right for five
           seconds") cannot be walked as written, and
           `docs/features/interstice/_facts.yml` acceptance.AC6 has no way to be shown on
           a device. Found while deriving scenarios from the code; reported to the owner
           with this set.'
    outcome: 'S17 is rendered blocked, naming this entry, until the app gains a seek control.'

  - id: D8
    role: symptom
    claim: 'After BACK, the same title cannot be opened again: the second open never
            completes and the screen stays in loading, with no error.'
    basis: measured
    evidence: { how: device, date: 2026-10-04, n: 5,
                spread: 'five of five: once by hand in Phase 0, four times as S04',
                cmd: 'the e2e:release script, scenario S04 — ENTER, wait for player.progress, BACK, ENTER',
                conditions: { target_platform: 'Vega Virtual Device, vvrp-tv-arm64, aarch64, OS 1.2 (TV Ship/102282480), simulated', build: 'Release aarch64, SDK 0.24.12112, Vega CLI 1.3.4', content_asset: 'clip: 20 s of Tears of Steel, 4 segments' },
                value: 'second launch of the title: app.play, loader.miss, scheduler.load, "player.surface created handle=2" twice — then nothing for 20 s. No buffer.appended, no player.opened, no player.error. The first open in the same launch is normal.' }
    log_line: 'INTERSTICE.player.opened segments=<n> init=<yes|none> — the package vega adapter, at the end of open()'
    status: open
    owned_by: 'docs/features/interstice/ and the package it consumes — one adapter instance is created at module scope in src/App.tsx and reused after destroy()'
    note_ownership: 'found by S04 on its first run and never seen by hand because no manual procedure plays a title twice. It is why S04 is FAIL in the published report, and it stays FAIL until the app is fixed: a harness that passed it would be wrong.'
    outcome: 'S04 fails, naming the assertion. AC2 of the app — BACK has a stated destination — holds; "and the viewer can start over" does not.'

  - id: D9
    role: symptom
    claim: 'A track file that is not valid JSON is reported as MISSING, not as unreadable.'
    basis: measured
    evidence: { how: device, date: 2026-10-04, n: 2, spread: 'both runs the same',
                cmd: 'the e2e:variant script, scenario S13 — the standard track served cut in half',
                conditions: { target_platform: 'Vega Virtual Device, vvrp-tv-arm64, aarch64, OS 1.2 (TV Ship/102282480), simulated', build: 'Release aarch64 + INTERSTICE_E2E, SDK 0.24.12112, Vega CLI 1.3.4', content_asset: 'e2e-fixture: first 60 s of Tears of Steel, host-served' },
                value: 'INTERSTICE.loader.miss path=http://localhost:8099/fx/e2e-fixture.standard.track.json, then ad.state kind=missing. No loader.load, no kind=malformed.' }
    log_line: 'INTERSTICE.loader.load path=<path> ok=false reason=malformed — the package TrackLoader; it is never reached, because readJson throws first'
    status: open
    owned_by: 'docs/features/interstice/ — readJson in src/App.tsx throws on a parse failure exactly as it does on a 404, and the loader treats every throw as absence'
    note_ownership: 'the app''s own manual step C.6 expects "a DIFFERENT stated message" for a truncated file. The malformed branch is reachable only by valid JSON of the wrong shape.'
    outcome: 'S13 fails. The viewer is told there is no track when there is one that could not be read.'

  - id: D7
    role: contributing
    claim: 'The beacon loses or reorders lines often enough to matter.'
    basis: asserted
    falsified_by: 'limits.trace.ordering falsified_by, which is the same observation'
    log_line: 'every line, through its seq field (contracts.beacon_query)'
    status: open
    note: 'the design does not wait on the answer: seq is added either way, because a
           harness that cannot tell a missing line from a line that was never emitted
           cannot make an absence assertion at all.'

alternatives:

  - id: A1
    name: appium-as-the-only-route
    outcome: discarded
    because: 'it is the documented route and stays as rung 2, but it is not rung 1: it
              needs an Appium server, the Vega driver, the device toolkit and a second
              Node install, and its screenshots are reported stale on this exact SDK.'
    basis: asserted
    depends_on: [D1]
    falsified_by: 'defects D1 false while limits.capture.appium_stale_frames is also falsified — then Appium is rung 1'

  - id: A2
    name: trace-only-report
    outcome: discarded
    because: 'kept as the floor (rung 3), not chosen as the design: the owner asked to SEE
              the use cases, and a judge reads a picture before a log.'
    basis: decided

  - id: A3
    name: runtime-e2e-switch-in-the-release-build
    outcome: discarded
    because: 'the Release package would ask localhost for a configuration at start and load
              its track from wherever the answer said. On a real device localhost is the
              device, so any process listening there could redirect what a blind viewer
              is told about the picture. A build-time flag leaves no such path in the
              submitted binary.'
    basis: decided

  - id: A4
    name: host-screen-recording
    outcome: discarded
    because: 'the app set measured on 2026-09-25 that the host cannot capture the emulator
              window without Screen Recording permission, and what it would capture is a
              window with chrome, not the device framebuffer.'
    basis: asserted
    depends_on: [D1]
    falsified_by: 'defects D1 and limits.capture.appium_stale_frames both leaving no working rung — then a permissioned window capture is better than no pixels'

  - id: A5
    name: more-component-tests-instead
    outcome: discarded
    because: 'the app set already has them and already wrote down their limit: a fake
              written alongside its subject encodes the subject''s assumptions. Six
              playback defects reached the device on 2026-09-27 through suites that were
              green. This set exists to run the device.'
    basis: decided

worst_case:
  basis: measured
  evidence: { how: device, date: 2026-10-04, n: 1, spread: 'single published run per suite',
              cmd: 'the e2e:release and e2e:variant scripts with --no-build; du -sk docs/e2e',
              conditions: { target_platform: 'Vega Virtual Device, vvrp-tv-arm64, aarch64, OS 1.2 (TV Ship/102282480), simulated', build: 'Release aarch64, SDK 0.24.12112, Vega CLI 1.3.4', content_asset: 'clip: 20 s of Tears of Steel, 4 segments' },
              value: 'RELEASE: 88.9 s of scenario time for five scenarios. VARIANT: 181.7 s for seven run and one blocked. docs/e2e: 2412 KB with ten screenshots and one 12 s clip.' }
  release_suite_wall_clock: '88.9 s of scenario time, plus about 20 s per package build'
  published_report_size: '2.4 MB'
  note: 'the longest scenario is S15 at 45 s, half of limits.timing.scenario_timeout_ms.
         The report is a tenth of limits.report.max_total_mb.'

# =====================================================================
# CONTRACTS
# =====================================================================
contracts:

  beacon_query:
    m: 'string — the line, e.g. INTERSTICE.player.stalled'
    b: 'string — launch id, random, fixed at module load'
    s: 'integer — sequence number within the launch, starting at 0, +1 per line'
    t: 'integer — Date.now() on the device, milliseconds'

  trace_event:
    boot: 'string — the launch id'
    seq: integer
    t_dev_ms: integer
    t_host: 'ISO 8601 string, stamped on arrival'
    line: string
    name: 'string — the line up to the first space, without the INTERSTICE. prefix'
    fields: 'object — the key=value pairs after it'

  e2e_config:
    host: 'string — origin of the collector as the device sees it'
    asset_id: 'string — limits.fixture.asset_id'
    asset_dir: 'string — where track files resolve'
    segment_base: 'string — where init and media segments resolve'

  fixture_asset:
    init: 'string — path of the init segment, relative to endpoints.fixtures'
    segments: 'array of { index, start_ms, end_ms, uri } — uri relative to endpoints.fixtures'

  scenario_result:
    id: string
    name: string
    suite: 'release | variant'
    use_case: string
    covers: 'string[] — ids in the app acceptance list'
    fixture: boolean
    verdict: 'pass | fail | blocked | skipped'
    reason: 'string | null — required unless pass'
    blocked_by: 'string | null — required when blocked'
    steps: 'array of { at_ms, action, detail }'
    assertions: 'array of { kind, expect, ok, matched_seq }'
    spoken: 'string[] — what the app announced, in order'
    artifacts: 'array of { kind: screenshot | clip, path, at_seq, caption } — path relative to the run directory'
    trace_path: 'string — relative to the run directory'
    duration_ms: integer

  run_record:
    run_id: string
    started_at: 'ISO 8601 string'
    suite: 'release | variant'
    conditions: '{ target_platform, build, content_asset } — the keys of _profile.yml conditions_required'
    app_commit: string
    package_version: string
    capture_rung: 'grpc | appium | none'
    input_route: 'inputd-cli | grpc'
    selftest: '{ ran: boolean, scenarios_that_can_fail: integer, of: integer }'
    restored_release: 'boolean | null — after a VARIANT suite, whether the Release package was reinstalled and said e2e=false; null for a RELEASE suite'
    results: 'scenario_result[]'

endpoints:
  beacon: 'GET http://localhost:8099/?m=<line>&b=<launch id>&s=<seq>&t=<device ms>'
  fixtures: 'GET http://localhost:8099/fx/<path>'
  emulator_grpc: 'localhost:8554 — the wrapper''s default port; off after every start of the device until enabled'

env_vars: [INTERSTICE_E2E, BEACON_PORT, E2E_CAPTURE]

tests_baseline:
  basis: measured
  evidence: { how: shell, cmd: 'npm test', date: 2026-10-04, n: 1, exit_code: 0,
              value: 'jest: Tests 24 passed, 24 total · vitest: Test Files 15 passed (15), Tests 116 passed (116)',
              note: 'before this set: jest 24, vitest 10 files and 70 tests. This set adds
                     five files and 46 tests under e2e/__tests__ — trace, collector,
                     scenarios, selftest, report. `_profile.yml` commands.tests_expect was
                     re-measured the same day and now reads "24 passed, 24 total", the
                     jest line; exit 0 remains the authoritative signal.
                     e2e/__tests__/fixtures.test.ts, named in 02e §B.2, is NOT written.' }

acceptance:
  - { id: AC1, item: 'the Phase 0 spike answers D1, D2, D3, D4 and D5 on the Virtual Device, and each answer is in this registry as measured before any Phase 1 code is written', status: approved, verified_on: 2026-10-04,
      evidence: 'defects D1..D5 each carry basis: measured with n, conditions and the decisive lines. Four hold; D4 was dead as written and holds with changes C24. Three files of Phases 4-5 (babel.config.js, src/e2e.ts, the flag half of src/App.tsx) were written DURING the spike because D4 and D5 cannot be asked without them; no file under e2e/ exists yet.' }
  - { id: AC2, item: 'one command runs the RELEASE suite against the Release package from a stopped app and exits non-zero if any scenario fails', status: approved, verified_on: 2026-10-04,
      evidence: 'npm run e2e:release: five verdicts, S04 FAIL on defects D8, exit code 1. Four runs.' }
  - { id: AC3, item: 'every verdict comes from assertions over the trace; no screenshot or clip decides one', status: written }
  - { id: AC4, item: 'the selftest shows every scenario can fail: with its decisive line removed from a recorded trace, each one returns fail', status: approved, verified_on: 2026-10-04,
      evidence: 'run records: selftest 4 of 4 (RELEASE) and 6 of 6 (VARIANT) passing scenarios shown able to fail; e2e/__tests__/selftest.test.ts over ten recorded traces.' }
  - { id: AC5, item: 'a trace with a gap in its sequence numbers yields fail with reason trace_incomplete, never pass', status: written }
  - { id: AC6, item: 'a blocked scenario names what blocks it and is never rendered as a pass or left out of the report', status: executed, verified_on: 2026-10-04,
      evidence: 'S17 is BLOCKED naming D6 in the run record and in the report. The other blocked path — no line from the device — has not been exercised on the device (02e §C.5 step 3).' }
  - { id: AC7, item: 'every result that used the fixture track is labelled FIXTURE wherever it appears, and no fixture file is inside the Release package', status: written }
  - { id: AC8, item: 'the report shows, per scenario: the use case in a sentence, the steps taken, what was captured, what the app spoke, the decisive trace lines, the app criteria covered, the verdict and the run conditions', status: written }
  - { id: AC9, item: 'the report carries a coverage matrix with one row per criterion of the app, its text read from the app registry at build time, its class, and the scenarios behind it; no criterion is missing', status: written }
  - { id: AC10, item: 'the report states what it cannot show — audible ducking, VoiceView, the memory bound on hardware, cue placement against dialogue — on the same page as what it does', status: written }
  - { id: AC11, item: 'the report rebuilds from its committed run record with no device attached', status: approved, verified_on: 2026-10-04,
      evidence: 'e2e/__tests__/report.test.ts builds it from a run record in a temp directory; npm run e2e:report rebuilds docs/e2e/index.html from docs/e2e/run/.' }
  - { id: AC12, item: 'the published report is within limits.report.max_total_mb, carries limits.report.attribution on every page showing the film, and is linked from README.md', status: written }
  - { id: AC13, item: 'a timeline strip per cue scenario shows windows, cue starts and ends, and the duck and restore instants, drawn from the trace', status: written }
  - { id: AC15, item: 'when a VARIANT suite ends, pass or fail, the device holds the Release package again, and the next launch emits INTERSTICE.app.mode e2e=false', status: approved, verified_on: 2026-10-04,
      evidence: 'restored_release: true in both VARIANT runs, each of which ended with a failing scenario; the RELEASE run made afterwards asserted app.mode e2e=false in S01.' }
  - { id: AC14, item: 'FRICTION-LOG.md gains a dated entry for each platform obstacle met while building this, written the day it is met', status: written }

