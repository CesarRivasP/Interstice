# =====================================================================
# HYPOTHESES UNDER INVESTIGATION — all three gate delivery, none is measured.
# =====================================================================
defects:

  - id: D5
    role: blocking
    claim: 'the Vega Virtual Device can decode and render H.264 video at all'
    basis: asserted
    falsified_by: 'any app playing any video on this Virtual Device — including
                   Amazon''s own vega-video-sample, which is the cheapest test'
    log_line: 'INTERSTICE.player.error code=<n> msg=<native message>'
    status: open
    outcome: null
    note: 'RAISED 2026-09-22 after six candidate causes were eliminated by
           measurement rather than argument. Every attempt to play a file ends in
           MEDIA_ERR_SRC_NOT_SUPPORTED (code 4) with an EMPTY native message.
           ELIMINATED, each with the observation that killed it:
           (1) format — canPlayType("video/mp4") returns "probably";
           (2) ordering — the surface/init race was real and is fixed
               (limits.vega_media.surface_races_init); the error survived the fix;
           (3) network reachability — JavaScript fetched the same URL over the
               forwarded port and got 200 video/mp4;
           (4) asset packaging — the clip is now required so metro bundles it, the
               build reports "Done copying assets", it resolves to
               file:///pkg/bundle/assets/src/assets/clip.mp4 and JavaScript reads
               that path successfully (probe.fetch 200);
           (5) codec profile — re-encoded to Constrained Baseline L3.0, yuv420p,
               AAC stereo; identical failure;
           (6) empty src — the W3C setter raises code 4 on an empty URL and that is
               the only such path in MediaPlayer.js, but the URI is logged non-empty
               and `ready src=set` confirms it at play time. The error arrives ~300 ms
               later from the native TurboModule, not from that check.
           No media decode error appears in the device syslog either.
           WHY THIS MATTERS BEYOND THE BUG: limits.hackathon.firetv_runtime_requirement
           accepts a demo video recorded on a real Fire TV device OR on the
           simulator. If the Virtual Device cannot decode video, AC1 and AC12 need
           PHYSICAL HARDWARE, which has a lead time and a cost and is on the owner''s
           clock — the same class of dependency as AC20 and D4, and it would be
           discovered at the worst possible moment if left unnamed.
           NEXT TEST, and it is cheap and decisive: build and run
           related_docs[R-VEGA-VIDEO] (AmazonAppDev/vega-video-sample) on this same
           Virtual Device. If Amazon''s own reference player cannot play video here,
           the device is the answer and this app is not the problem.'

  - id: D4
    role: blocking
    claim: 'Amazon Bedrock refuses every InvokeModel and Converse call on AWS account
            the entrant AWS account, in every region tried, while Polly on the same credentials
            succeeds. The block is account-scoped and Bedrock-specific.'
    basis: measured
    evidence: { how: shell, date: 2026-09-22,
                cmd: 'aws bedrock-runtime converse --region us-east-1 --model-id amazon.nova-lite-v1:0 --messages ... ; aws bedrock get-foundation-model-availability --region us-east-1 --model-id amazon.nova-lite-v1:0',
                value: 'ValidationException — "Error 002: Access to Bedrock models is not
                        allowed for this account"; identical in us-east-1, us-west-2 and
                        eu-west-1, and identical for InvokeModel and Converse.
                        get-foundation-model-availability returns regionAvailability
                        AVAILABLE, entitlementAvailability AVAILABLE, agreementAvailability
                        AVAILABLE, authorizationStatus NOT_AUTHORIZED.' }
    falsified_by: 'a successful InvokeModel or Converse on any Nova model from this account'
    log_line: null
    status: open
    outcome: null
    note: 'RULED OUT by measurement, so no later round re-tests them: not regional (three
           regions, same error) · not the API shape (InvokeModel and Converse, same error)
           · not the retired Model-access console page (it is retired; models auto-enable
           on first invoke, and the first invoke is what fails) · not the credentials or
           the account state (Polly synthesises audio on the same root session; account
           created 2018-04-17, state ACTIVE) · not an SCP (the account is not in an
           Organization).
           LEADING HYPOTHESIS, unconfirmed: Bedrock carries country availability
           availability restrictions that other AWS services do not, and this account
           falls outside the region list that carries it. This produces exactly the
           observed shape — region, entitlement and
           agreement all AVAILABLE, authorization denied at account scope.
           THE AUTHORITATIVE ANSWER IS AN AWS SUPPORT CASE, which is free for account
           issues. Ask why authorizationStatus is NOT_AUTHORIZED in all regions when
           Polly works. Working around a geographic restriction is not an option under
           consideration: the rules require the entrant to be authorized to use every
           third-party service in accordance with its terms.
           BLAST RADIUS, measured rather than feared: this blocks C9 (pipeline/describe.ts)
           and nothing else. C10 is Polly and is unaffected. The Fire TV primary track does
           not touch AWS at all. The AWS Builder mini challenge does NOT require Bedrock
           (decisions.hackathon_track) — Polly satisfies it. So D4 costs the vision model,
