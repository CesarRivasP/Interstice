  - id: D3
    role: contributing
    claim: 'the Vega OS simulator installs and runs on this machine, and plays the
            demo asset'
    basis: measured
    evidence: { how: shell, date: 2026-09-22,
                cmd: 'bash get_vvm.sh ; vega --version ; vega virtual-device start ; vega virtual-device status ; vega device info',
                value: 'Active SDK Version: 0.24.12112 / Vega CLI Version: 1.3.4 ·
                        "Launching virtual device. Waiting for virtual device to boot.
                        Virtual device ready." · status {"running":true,"process_ids":
                        {"qemu":68674}} · device info {"architecture":"aarch64",
                        "profile":"tv","product":"vvrp-tv-arm64","buildDescription":
                        "OS 1.2 (TV Ship/102282480)","simulated":true,
                        "inDeveloperMode":true}' }
    falsified_by: 'the simulator failing to install or start, or refusing to decode
                   the demo asset'
    log_line: null
    status: resolved_partial
    outcome: 'PLATFORM HALF CONFIRMED, PLAYBACK HALF NOT YET TESTED — and the split
              matters, so it is recorded rather than rounded up to a pass.
              CONFIRMED 2026-09-22: the SDK installs on this machine (macOS 26.7,
              arm64), the Vega Virtual Device boots under QEMU, reports profile "tv"
              on aarch64, and answers `vega device info` in developer mode. The
              platform choice is no longer a hypothesis and alternatives[A4] is
              discarded on that basis.
              NOT TESTED: "and plays the demo asset". There is no app and no asset
              yet, so nothing has decoded video on this device. That half closes in
