# DOMAIN FACTS
# =====================================================================
limits:

  hackathon:
    basis: measured
    source: 'https://amazonappdev2026.devpost.com/rules'
    evidence: { how: shell, date: 2026-09-22,
                cmd: 'curl -sS --max-time 45 https://r.jina.ai/https://amazonappdev2026.devpost.com/rules',
                value: 'Submission Period ... - Friday, October 23, 2026 (12:00 pm Pacific Time);
                        Judging Period: Monday, November 9, 2026 - Friday, November 20, 2026;
                        Winners Announced: on or around Thursday, December 3, 2026;
                        $150 in AWS Promotional Credits ... by October 21st at 12pm PT',
                note: 'R1 left every value here `asserted` because a direct curl to
                       devpost returns HTTP 202 with an empty body, so nothing was
                       re-runnable. The read proxy IS re-runnable, which is what makes
                       this measured. The dates and the credit amount came back
                       unchanged from R1 — the two corrections below did not.' }
    submission_deadline: '2026-10-23 12:00 PT'
    judging_period: '2026-11-09 .. 2026-11-20'
    winners_announced: '2026-12-03'
    video_max_minutes: 3
    video_language: english
    aws_credits_usd: 150
    aws_credits_request_deadline: '2026-10-21 12:00 PT'
    aws_credits_form: 'https://forms.gle/5hyhr1u6x3fuV2aW7'
    aws_credits_requested: '2026-09-22 — submitted by the owner. Closes the Phase 0 checklist item.'
    friction_log_bonus_pct: 10
    repo_must_be: 'EITHER public with a detectable open-source license file (visible in the
                   GitHub About section) OR private and shared with testing@devpost.com plus
                   the six named Amazon Developer Relations GitHub accounts (chris-trag,
                   knmeiss, giolaq, anishamalde, mosesroth, emersonsklar). Either way the
                   repository must hold all source, assets and clear setup/run instructions.'
    firetv_runtime_requirement: 'any framework or language; the requirement is that the
                                 project RUNS on Fire OS or Vega OS, and the demo video
                                 shows it running on a real Fire TV device or on the
                                 Fire TV / Vega simulator. Fire TV is explicitly exempt
                                 from the runtime-technology-hook rule the other tracks
                                 carry.'
    note: 'judging is two stages: stage one pass/fail on baseline viability, stage
           two on five EQUALLY weighted criteria (tech implementation, design,
           potential impact, quality of idea, friction-log bonus up to 10%).
           TWO CORRECTIONS LANDED IN R10, both written wrong since R1.
           (1) repo_must_be said `public, open-source licensed` full stop. The rules
           allow a PRIVATE repo shared with the named reviewers as an equal option.
           This matters: it is the difference between a hard constraint on where
           credentials and assets may live and a choice.
           (2) The credit form URL differs between the two pages — rules say
           forms.gle/5hyhr1u6x3fuV2aW7, resources says forms.gle/GaHFxSbBQNG9Kti6A.
           aws_credits_form records the RULES url because the rules are the contract.
           Recorded rather than silently picked, because a later round would find
           the other link and assume this one was a typo.'

  bedrock:
    basis: asserted
    falsified_by: 'a ThrottlingException on the first pipeline run, or a documented
                   per-account InvokeModel quota different from what is assumed here'
    blocked_by: D4
    region: 'us-east-1 — measured 2026-09-22: it carries all three multimodal Nova
              models. The region was a guess until then.'
    model_candidates: 'amazon.nova-pro-v1:0 and amazon.nova-lite-v1:0 (both ON_DEMAND
              + INFERENCE_PROFILE, both accept IMAGE input). amazon.nova-2-lite-v1:0
              is INFERENCE_PROFILE ONLY — invoking it with a bare model id fails, it
              needs an inference-profile ARN. Recorded because it is the newest and
              therefore the one a later round is most likely to reach for by name.'
    model_chosen: 'undecided until D4 clears. Nova Pro for cue quality (AC14 is scored
              on it) unless a measured comparison says Lite is close enough; the run is
              ~40 gaps x 3 verbosity levels + 1 cast pass = ~121 calls, so cost does
              not decide this.'
    invoke_rate_per_account: unknown
    on_throttle: 'exponential backoff, max 5 attempts, then the cue is written with
                  status: failed and the track still emits'
    note: 'the pipeline is offline and batched, so a throttle costs wall-clock time,
           never a broken demo. The number is unknown on purpose — it is asked of
           the console before the first full run, not guessed here.'

  polly:
    basis: asserted
    falsified_by: 'a SynthesizeSpeech rejection on a cue that is under the assumed
                   character bound'
    reachable: 'YES — measured 2026-09-22 on the entrant AWS account, us-east-1:
                `aws polly synthesize-speech --engine neural --voice-id Joanna` returned
                ContentType audio/mpeg. Polly works on the same credentials Bedrock
                refuses (D4), which is what proves D4 is Bedrock-specific and not an
                account-wide or credential problem.'
    neural_voices_en_us: 'Danielle, Gregory, Joanna, Ruth, Kevin, Salli, Matthew,
                Kimberly, Kendra, Justin, Joey, Ivy — measured via describe-voices.'
    voice_chosen: 'Joanna or Matthew. Audio description convention is a neutral,
                clearly-articulated voice distinct from the film cast, so the viewer
                never confuses narration with dialogue. Settle it during the AC14 watch,
                not now.'
    chars_per_request: unknown
    note: 'a cue is bounded to `ad.max_words_per_cue`, roughly two orders of
           magnitude below any documented Polly bound, so this limit is not
           expected to bind. Confirmed on the first run, not before.'

  ad:
    basis: decided
    min_gap_ms: 1500
    speaking_rate_wpm: 160
    max_words_per_cue: 'floor((gap_ms - 300) / 1000 * 160 / 60)'
    duck_target_pct: 25
    duck_ramp_ms: 200
    frames_per_gap_max: 3
    max_cue_ms: 12000
    min_useful_words: 3
    rolling_context_cues: 10
    verbosity_scales: { concise: 0.6, standard: 0.85, detailed: 1.0 }
    quality_gate: 'every cue rated 1–5 against picture; track mean and worst regenerated before video'
    note: 'a description that runs past its gap talks over dialogue, which is worse
            than no description. The 300 ms subtrahend is the ramp plus a margin.
            frames_per_gap_max bounds the frames sent per Bedrock call (the
            midpoint, plus per-shot frames when the gap spans a cut) — still one
            call per cue. rolling_context_cues is how many preceding descriptions
            are fed back into the prompt so names stay consistent across the film.
            dramatis personae (decisions.dramatis_personae) is the naming anchor
            fed alongside rolling context.
            max_cue_ms AND min_useful_words WERE ADDED IN R13, after running C7
            against the real subtitle file. Both close holes the spec could not see
            from prose, because prose imagined a gap as a short interstice between
            two lines and the data says otherwise.
            max_cue_ms (12000): a gap is NOT a cue. Tears of Steel has 5 gaps over
            30 seconds and they carry 68% of all the words in the track; the longest
            is 167s with a 444-word ceiling. One description covering 167 seconds is
            not a description, and a single midpoint frame cannot represent a minute
            of film that contains several shots. A gap longer than max_cue_ms is
            SPLIT into consecutive cues, each with its own frames and its own budget.
            38 gaps become ~70 cues at 12s. This makes gap -> cue one-to-many and
            re-scopes C7, C8, C9 and C10, all of which were written 1:1.
            min_useful_words (3): 13 of the 38 gaps are 1.5-2.0s and yield 1-2 words
            at concise verbosity. A two-word description is noise that costs a
            Bedrock call, a Polly call and an interruption. Below this the gap is
            skipped and no cue is emitted, which also means the count of cues varies
            by verbosity level — contracts.description_track already carries
            verbosity, so a track declares what it contains.
            VERBOSITY, AND WHY EVERY SCALE IS <= 1.0. max_words_per_cue is a
            PHYSICAL ceiling: the gap is the time available and no level may
            exceed it (AC4). So verbosity_scales are TARGETS expressed as a
            fraction of that ceiling, never multipliers of it — the model is
            told how many words to aim for, and the ceiling is what validation
            rejects against. A level above 1.0 is unreachable by construction.
            This was got wrong twice and both attempts are recorded so a third
            round does not repeat them: R3 set the scales to x0.6 / x1.0 / x1.35;
            R8 noticed detailed was unreachable and added a separate clamp
            (hard_ceiling_words) that subtracted only duck_ramp_ms; R9 RAN the
            arithmetic and found the clamp changes nothing — 100 ms at 160 wpm is
            0.27 words, so it never crosses a floor boundary and standard ==
            detailed at every gap size from 1500 ms to 12000 ms. hard_ceiling_words
            was removed with that finding. Under the scales above the three levels
            are strictly distinct at every gap size >= min_gap_ms, which is what
            AC17 needs and what 02e §B.1 asserts.'

  vega_media:
    basis: measured
    evidence: { how: shell, date: 2026-09-22,
                cmd: 'npm pack @amazon-devices/react-native-w3cmedia@2.3.2 && cat package/dist/index.d.ts package/dist/interface/*.d.ts',
                value: 'package version 2.3.2; exports and members as listed below' }
    package: '@amazon-devices/react-native-w3cmedia@2.3.2'
    note: 'Vega media is W3C MSE/EME — NOT ExoPlayer and NOT react-native-video.
           Reaching for either is the documented first mistake. These names are the
           ones 02c Phase 7 must be rebuilt against; it was written against an
           invented MediaAdapter shape while D3 was still open, which was correct
           then and is stale now.'
    video_player: 'class VideoPlayer extends MediaPlayer implements HTMLVideoElement.
           initialize(): Promise<void> · deinitialize() · deinitializeSync(timeoutInMs)
           · setSurfaceHandle() · clearSurfaceHandle() · setMediaControlFocus()
           · getVideoPlaybackQuality() · videoWidth · videoHeight · width · height
           · poster · playsInline. It does NOT render by itself: the app mounts a
           KeplerVideoSurfaceView, waits for onSurfaceViewCreated, and passes the
           handle in. It also builds no media-control GUI — the app owns that.'
    media_player_members: 'currentTime (get/set) · duration · paused · seeking
           · volume (get/set, 0.0-1.0) · muted · defaultMuted · audioTracks
           · videoTracks · textTracks · error (MEDIA_ERR_*)'
    audio_player: 'class AudioPlayer extends MediaPlayer, constructed as
           new AudioPlayer(audioType?: AudioContentType, audioUsage?: AudioUsageType).
           For description cues the correct construction is
           (AudioContentType.CONTENT_TYPE_SPEECH, AudioUsageType.USAGE_ACCESSIBILITY).'
    audio_usage_accessibility: 'AudioUsageType.USAGE_ACCESSIBILITY = 5, documented in
           the SDK as "Audio Usage for Accessibility prompts". This product IS that
           category. Any D2 runtime test must construct the cue player with it —
           testing under USAGE_MEDIA would test a different thing and could fail for
           the wrong reason.'
    audio_track_switching: 'MediaPlayer.audioTracks: AudioTrackList; AudioTrack has
           id, kind, label, language and enabled (get/set). This is the typed
           interface behind decisions.d2_fallback.'
    no_volume_ramp: 'the W3C volume setter is instantaneous — no ramp parameter exists
           anywhere in the surface. limits.ad.duck_ramp_ms must be implemented as a
           stepped fade in JS. 02c Phase 10 assumed the platform ramped and is wrong
           on that point.'
    components: 'KeplerVideoSurfaceView (+ onSurfaceViewCreated), KeplerVideoView,
           KeplerShareableSurfaceView, KeplerCaptionsView'
    manifest_requirement: 'media services must be declared under [wants] in
           manifest.toml (changes C17). Missing services cause SILENT playback
           failure — no video and no error.'
    no_js_console: 'MEASURED 2026-09-22. There is NO readable JavaScript console on
           this platform. console.log reaches `vega device start-log-stream` in
           neither Release nor Debug, and since React Native 0.73 Metro prints
           "JavaScript logs have moved" and routes them to React Native DevTools,
           which needs a browser. Every INTERSTICE.* line references/implementable.md
           specifies would be written and never read. The channel that works is an
           HTTP beacon over the reverse port forwarding the device already uses for
           Metro — tools/beacon-server.mjs plus src/diagnostics.ts. This is the
           single most useful thing measured on this platform so far: without it the
           D2 runtime test cannot report its result either.'
    media_process_is_separate: 'MEASURED 2026-09-22, and it constrains where the asset
           may live. The JavaScript side fetched http://localhost:8100/clip.mp4 over
           the reverse port forwarding and got `status=200 type=video/mp4`; the
           VideoPlayer rejected the SAME url with MEDIA_ERR_SRC_NOT_SUPPORTED
           (code 4) and the http server logged NO request from it. canPlayType
           ("video/mp4") returns "probably", so the format is not the issue. The
           media pipeline runs in its own process (com.amazon.media.server) which
           does not share the app process network path. CONSEQUENCE: the demo asset
           must be reachable by THAT process — bundled in the package, or served
           from a host the device genuinely routes to. Host-localhost forwarding
           works for the app and not for playback, and the two look identical from
           JavaScript.'
    surface_races_init: 'MEASURED 2026-09-22. VideoPlayer.initialize() and the
           platform handing over the surface are independent async signals with no
           guaranteed order — the surface arrived 26 ms BEFORE initialize() resolved.
           Calling play() from the surface callback alone plays a player whose src is
           not set yet and yields MEDIA_ERR_SRC_NOT_SUPPORTED, which reads exactly
           like an unsupported file and is not one. Both signals must be tracked and
           whichever lands second starts playback.'

  clip_cache:
    basis: decided
    max_clips_in_memory: 8
    note: 'a Fire TV Stick is a 32-bit process with a small heap. Clips stream from
           disk; only the next N are resident. Verified on the worst device in the
           matrix, not on the simulator.'

  typesafe:
    basis: decided
    status: 'inactive — C15/C16 are kind: deferred (decisions.typesafe_judgment_layer).
              Kept so the entries reopen with their bar already stated.'
    injection_noul_threshold: 0.7
    note: 'C16 probability threshold above which a subtitle line is treated as
           suspected injection and dropped from the C9 context, before C9''s own
           delimited-data + shape validation runs as the second layer. Tuned by
           hand against the demo asset subtitle file — no other subtitle corpus
           is in scope for this build. Jev/System One is text-only (no image or
           video input), so it is never used to judge AC14 visual fidelity;
           limits.ad.quality_gate stays a human watch for that.'

