# =====================================================================
# DECISIONS — premises the prose hangs off. `sync` cannot follow these:
# changing one means walking its `cited_in:` list by hand.
# =====================================================================
decisions:

  hackathon_track:
    date: 2026-09-19
    basis: decided
    what: 'Fire TV is the primary track, on Vega OS, and both mini challenges are
           entered on top of it: AWS Builder and Open Source (the extracted
           package, changes C12). A submission may win at most one track prize
           and one mini-challenge prize.
           AWS BUILDER DOES NOT REQUIRE BEDROCK — measured against the rules and
           resources pages in R10: the ask is to "incorporate AWS services with
           documented integrations", and Bedrock / AgentCore / Strands / Kiro /
           SageMaker are named as examples followed by "and more". Polly alone
           satisfies it. This is load-bearing now that D4 has Bedrock blocked at
           the account level: the mini challenge survives D4, only C9 does not.'
    why: 'the entrant has years of TV app work; Vega OS is the newest and least
          crowded surface in the track, and the judges are the team promoting it.'
    cited_in: ['01 §1', '01 §2', '01 §7']

  hybrid_ad_path:
    date: 2026-09-19
    basis: decided
    what: 'The prepared description track is the guaranteed base path: the pipeline
           generates it offline and the app consumes it. Live frame capture is an
           OPTIONAL layer (changes C11, kind: deferred) that ships only if D1 is
           confirmed. The demo never depends on the optional layer.'
    why: 'D1 is unverified and gates a whole delivery. A demo with nothing to show
          on 2026-10-23 scores zero on every criterion.'
    cited_in: ['01 §2', '01 §3.2', '01 §8']

  demo_asset_licensing:
    date: 2026-09-19
    basis: decided
    what: 'The demo plays an openly licensed asset with published subtitles — a
           Blender Foundation open movie (CC-BY) is the default candidate — and
           the asset must carry SUBSTANTIAL DIALOGUE: the gap structure the whole
           mechanism rests on comes from the subtitle file, so a near-dialogue-free
           film (Big Buck Bunny, Sintel) collapses the demo into one continuous
           gap. Candidates: Tears of Steel, Elephants Dream. Subtitle availability
           and quality are verified in Phase 0, before any pipeline work. No
           commercial or personally recorded content appears in the app or the
           submission video.
           CHOSEN 2026-09-22: TEARS OF STEEL, and the choice is measured rather than
           argued. Its real English subtitle track (download.blender.org, CC-BY) runs
           through C7 to 76 cues, 67 speech spans, 38 gaps >= min_gap_ms, 18.6% of
           the runtime dialogue and 78.6% describable. The substantial-dialogue
           requirement this decision added in R2 is satisfied with room to spare, and
           the gap mechanism has 577 seconds to work in. Elephants Dream was not
           measured — Tears of Steel cleared the bar decisively, so the comparison
           would have cost time and changed nothing.
           OPEN, and it belongs to this decision rather than to the pipeline: the
           film''s dialogue ends at 567s but the asset runs to ~734s, so C7 emits a
           167-second trailing gap that is the credits. Credits must not be described.
           Bound the content end before Phase 1 closes — either an explicit
           content_end_ms on the asset or a rule that drops the trailing gap.'
    why: 'the rules require the video to carry no unauthorized third-party
           copyrighted material, and the video is published publicly on YouTube.
           Content rights are the single most common disqualification in a media
           hackathon and cost nothing to avoid at design time. The dialogue
           requirement guards the mechanism itself: no dialogue, no gaps, no
           demo to show.'
    cited_in: ['01 §2', '01 §5', '01 §7', '01 §8']

  privacy_optin:
    date: 2026-09-19
    basis: decided
    what: 'The live capture layer (C11) sends a frame of what the viewer is
           watching to a third party (Bedrock). It is OFF by default, requires an
           explicit in-app opt-in that names where the frame goes, and the README
           states it. The prepared path sends nothing at runtime.'
    why: 'shipping screen content to a cloud model without the viewer saying yes is
          the gap sweep finding S1; an accessibility product that leaks what a
          blind user is watching is worse than no product.'
    cited_in: ['01 §5', '01 §8']

  oss_package_scope:
    date: 2026-09-19
    basis: decided
    what: 'The Open Source mini challenge is entered with `react-native-tv-audio-description`
           (changes C12): a standalone public repo holding the TV-side description
           layer — cue scheduling, ducking, remote-control toggle, focus-safe state
           surface — with a runnable example. It is NOT the pipeline and NOT the app.'
    why: 'the reusable half is the TV integration, which is the entrant edge; the
          pipeline is asset-specific glue and nobody would install it.'
    confirmed_against_rules: 'R10, 2026-09-22. The rules accept "a new repo (with
          open-source license), a branch, a fork, or a pull request", so a standalone
          new repository is an explicitly valid entry and not a stretch of the wording.
          Required submission fields, which C14 must collect: contribution URL,
          project repository URL, GitHub username, and a description of what was done,
          how it works and why it matters.'
    cited_in: ['01 §2', '01 §3.1', '01 §7']

  docs_in_english:
    date: 2026-09-19
    basis: decided
    what: 'The spec set is written in English (`_profile.yml prose_language: en`).'
    why: 'the repo must be public under an open-source license and judges may open
          docs/. Submission materials are required to be in English regardless.'
    cited_in: ['01 §1']

  product_name:
    date: 2026-09-19
    basis: decided
    what: 'The product is named Interstice; `app_id` is com.cesarrivasp.interstice.'
    why: 'name search found AudioLens taken commercially twice (iZotope; Google Play
          com.transhumantec.audiolens) and Narra taken by an AI video-narration app
          (Google Play com.narra.video) — a direct namesake in this exact product
          space. EchoScene is commercially free but collides with the ECCV 2024
          paper and repo of the same name in the same CV/AI field. No product
           collision was found for Interstice in accessibility or audio description.'
    cited_in: ['01 §2']

  d2_fallback:
    date: 2026-09-19
    basis: decided
    what: 'If D2 fails, the fallback is a SECOND AUDIO TRACK, pre-mixed offline:
            the pipeline renders ducking and the description cues into one
            full-length track, and the app toggles description by switching the
            player audio track — a standard player capability that needs no
            concurrent streams. Pausing the asset for each cue is the last
            resort, not the plan.'
    why: 'pausing the film for several seconds every few minutes breaks the
           premise of watching a film and makes a poor demo; the pre-mix keeps
           playback fluid, reuses the offline pipeline that already exists, and
           costs only per-cue granularity (no mid-cue skip on the fallback
           track).'
    cited_in: ['01 §3.2', '01 §8']

  verbosity_levels:
    date: 2026-09-19
    basis: decided
    what: 'The remote exposes three verbosity levels — concise / standard / detailed.
            limits.ad.max_words_per_cue is the single physical ceiling for all three
            (the gap is the time available); limits.ad.verbosity_scales are TARGETS
            as a fraction of it — ×0.6 / ×0.85 / ×1.0, floored. The target is what
            the C9 prompt asks for; the ceiling is what validation rejects against.
            No level may exceed the ceiling, and none needs to: detailed simply
            spends the whole gap. The pipeline regenerates the track per level and
            the app selects the matching track at runtime.
            LOOKUP RULE: one track file per level, named
            `<asset_id>.<verbosity>.track.json` beside the asset, and every track
            declares its own level in contracts.description_track.verbosity. The app
            resolves a level switch by that name and falls back to `standard`.'
    why: 'per-viewer control is what separates a feature from a file (A2) and
           is demoable on the remote in 10 seconds; it scores design + tech
           implementation simultaneously and costs one regeneration per level.'
    cited_in: ['01 §2', '01 §3.1', '01 §7', '01 §8']

  dramatis_personae:
    date: 2026-09-19
    basis: decided
    what: 'The first pipeline pass builds a dramatis personae — a short cast map
            (name/appearance anchor per principal) — from opening-scene frames +
            subtitle speaker cues; every subsequent C9 prompt carries it alongside
            limits.ad.rolling_context_cues so naming stays stable across the film.'
    why: 'rolling context alone drifts (pronoun drift, the woman/she/name).
           A named anchor generated once and re-fed is one extra Bedrock call,
           negligible cost, outsized gain in cue coherence and in the quality
           story told to judges.'
    cited_in: ['01 §2', '01 §3.1', '01 §8']

  gap_visualization:
    date: 2026-09-19
    basis: decided
    what: 'The demo video and SUBMISSION.md visualize the gap structure: a
            timeline strip with dialogue blocks vs gaps, markers for cue
            placement, and a split-screen before/after (silence vs ducking +
            description). The gap data comes from C7 and is rendered offline.'
    why: 'a gap is silence — invisible to a sighted judge watching a 3-minute
           video. If it is not visualized, the core mechanism does not exist
           in the judging room.'
    cited_in: ['01 §2', '01 §3.1', '01 §7', '01 §8']

  user_validation:
    date: 2026-09-19
    basis: decided
    what: 'Before Phase 5, at least one blind or low-vision viewer validates the
            track: 20–30 min session, with/without description, consent recorded,
            anonymized quote retained for SUBMISSION.md and the video if
            permission is given. No PII is stored in the repo.
            RECRUITMENT OPENS IN PHASE 0 — the participant is outside this team and
            runs on their own clock (tracking.blocked_by). If nobody is confirmed by
            10-16 (the start of Phase 4), AC20 is dropped and the submission says so
            rather than slipping the deadline.'
    why: 'a sourced coverage figure (AC16) proves scale; a single validated
           viewer proves the product works for its intended user — the
           potential-impact criterion is won with a face, not a number alone.'
    cited_in: ['01 §3.2', '01 §7', '01 §8']

  schedule_risk_accepted:
    date: 2026-09-19
    basis: decided
    accepted_by: 'César Rivas'
    what: 'v1 -> v4 added two components and nine acceptance criteria without moving
            a single phase date (review R5-F5). The dates in 01 §3.2 stand as they
            are, and the one-day submission buffer (10-22) is accepted as spent.
            ORDER OF SACRIFICE if the clock runs out, decided now rather than at
            02:00 on 10-22: AC19 (gap visualization) degrades to a static diagram,
            then AC20 (user validation) is dropped per its own fallback, then AC14
            (cue scoring) drops from every cue to a stratified sample. AC1..AC13 and
            the submission itself never yield.'
    why: 'deferring C15/C16 gave Phase 1 room back, but Phase 4 still holds a
           full-length cue-by-cue watch and Phase 5 still holds a recruited session
           plus the video plus the submission. Naming what falls first, in writing,
           is what makes the buffer being gone a decision instead of a discovery.'
    cited_in: ['01 §3.2', '01 §8']

  friction_log_shape:
    date: 2026-09-19
    basis: decided
    what: 'FRICTION-LOG.md (C13) entries follow the shape tool | expected |
            happened | workaround | time_lost, are dated and written DURING the
            build, and target 5–8 real entries covering Vega/ Bedrock / Polly
            setup — not a reconstruction at the end.'
    why: 'the 10% bonus is not guaranteed (accepted risk) and a log written
           at the end reads as fabricated; a shaped log written as a by-product
           costs near zero and is the only form that scores.'
    cited_in: ['01 §3.1', '01 §3.2', '01 §7']

  typesafe_judgment_layer:
    date: 2026-09-19
    basis: decided
    status: deferred
    what: 'DEFERRED on 2026-09-19 (review R5). The design below stands and the
            components stay in changes[] as kind: deferred; nothing is built now.
            TypeSafe (Jev, System One) would be a small text-only judgment
            layer alongside Bedrock/Polly, in two places only: (1) C15 —
            a Choice call matches each generated cue''s character reference
            against the dramatis_personae cast list and normalizes it before
            synthesis; (2) C16 — a Noul call screens each subtitle line for
            injection intent before it enters the C9 prompt as context, dropping
            and logging any line over limits.typesafe.injection_noul_threshold.
            Jev is text-only (no image/video input) and is NOT used to score
            AC14 visual fidelity — that stays a human watch per
            limits.ad.quality_gate.'
    why: 'naming drift (C2/F3) is today mitigated only by rolling_context_cues,
           a soft nudge with nothing checking the result; Choice gives a
           checkable, code-enforced normalization step for near-zero added
           latency next to one Bedrock multimodal call per gap. Subtitle
           prompt injection (S2) is today mitigated only on the output side
           (delimited data + shape validation); Noul adds a cheap pre-input
           filter as a second layer, and is a defense-in-depth story worth
           telling judges on a security-conscious build.'
    why_deferred: 'both problems already carry a mitigation (naming drift:
           dramatis_personae + rolling_context_cues; subtitle injection: delimited
           data + output shape validation, over a subtitle file the author chooses);
           a third non-Amazon vendor adds an API key and a setup step to a repo the
           judges must run; and review R5 found that C15 rewrites cue text AFTER the
           word budget is applied, so it can push a cue past its gap — the failure
           AC4 forbids. Deferring costs nothing today and returns Phase 1 to C7..C10.'
    reopens_when: 'Phase 1 closes with the pipeline green before 09-30. Reopening
           brings back AC21/AC22, which were removed from acceptance[] with these
           entries rather than left as criteria nothing could satisfy.'
    cited_in: ['01 §2', '01 §3.1', '01 §5', '01 §7', '01 §8']

