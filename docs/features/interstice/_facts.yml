              entry as a full pass would skip the only test that proves the product
              can run at all.'
    note: 'this was the cheapest and most total risk in the set — if it had been false
           the whole Vega plan fell back to Fire OS on day 1 rather than on day 30.
           It was run first, as the plan required, and it held. Phase 0 opened 09-19
           and D3 closed 09-22, the last day the plan allowed for it.'

  - id: D1
    role: contributing
    claim: 'Vega OS exposes the currently rendered video frame to JavaScript at
            runtime, as a decodable buffer'
    basis: measured
    evidence: { how: shell, date: 2026-09-22,
                cmd: 'npm pack @amazon-devices/react-native-w3cmedia@2.3.2 && tar xzf amazon-devices-react-native-w3cmedia-2.3.2.tgz && cat package/dist/interface/VideoPlayer.d.ts',
                value: 'the COMPLETE VideoPlayer surface is: initialize, deinitialize,
                        deinitializeSync, setSurfaceHandle, clearSurfaceHandle,
                        setMediaControlFocus, handleEvent, getVideoPlaybackQuality,
                        videoWidth, videoHeight, width, height, poster, playsInline.
                        No frame accessor of any kind. A grep across the whole package
                        for ArrayBuffer/Uint8/pixel/bitmap/capture/thumbnail returns
                        only EME key material (initData, key, iv) and MSE appendBuffer
                        — all of them INPUTS, none an output.' }
    falsified_by: 'the media API surface having no frame accessor, or returning an
                   empty or black buffer on a playing asset'
    log_line: 'INTERSTICE.frame w=<n> h=<n> bytes=<n>'
    status: resolved
    outcome: 'FALSE. There is no frame accessor, and the architecture says why:
              VideoPlayer never composites into anything JavaScript can read. It
              renders to a NATIVE SURFACE — the app mounts a KeplerVideoSurfaceView,
              receives onSurfaceViewCreated, and hands the surface handle to the
              player via setSurfaceHandle. Pixels go from the decoder to that surface
              and are never in JS-reachable memory, so there is no drawImage-style
              path and no buffer to read. This is a property of the design, not a
              missing feature, so it will not change in a later SDK release.
              CONSEQUENCE: C11 (src/ad/LiveCapture.ts) stays kind: deferred for this
              build, permanently rather than pending. Its reopens_when condition —
              "a device/simulator run shows a decodable current frame reaching JS" —
              is now known to be unsatisfiable on Vega, and the entry should not be
              re-proposed without new evidence that the media stack changed.
              The diagnostic log_line above was never emitted: the question was
              settled by the API surface before a device run was needed, which is
              cheaper than the spike 01 §3.2 had budgeted.
              decisions.hybrid_ad_path is vindicated exactly as written — it made the
              prepared track the base path BECAUSE D1 was unverified, and D1 is now
              false. Nothing in the demo moves.'
    note: 'gates C11 only. The prepared path (C7..C10) does not depend on it, which
           is the entire point of decisions.hybrid_ad_path.'

  - id: D2
    role: contributing
    claim: 'a second audio stream can play on Vega while the video player volume is
            ducked, without the platform stopping one of them'
    basis: asserted
    falsified_by: 'the platform refusing concurrent playback, or the duck call
                   returning without changing the audible level'
    log_line: 'INTERSTICE.duck from=<n> to=<n>'
    status: open
    outcome: null
    note: 'gates the product itself, not a layer. If ducking is impossible the
            fallback is decisions.d2_fallback: a pre-mixed second audio track
            rendered by the offline pipeline, toggled by audio-track switching.
            Pausing the asset per cue is the last resort. Decided in Phase 0,
            not discovered late.
            RE-AIMED IN R12 BY READING THE API (@amazon-devices/react-native-w3cmedia
            @2.3.2 type declarations). Three things are now known without a device:
            (1) DUCKING EXISTS AND IS W3C. MediaPlayer has `get volume(): number` /
            `set volume(volume: number)` per the HTML spec, so limits.ad.duck_target_pct
            maps to `player.volume = 0.25`. But the W3C setter is INSTANTANEOUS —
            there is no ramp parameter anywhere in the surface — so
            limits.ad.duck_ramp_ms (200) must be implemented in JS as a stepped
            fade. That is a real change to 02c Phase 10, which wrote
            `setVolumePct(pct, rampMs)` as though the platform ramped for us.
            (2) THE SECOND STREAM HAS A FIRST-CLASS CATEGORY FOR THIS EXACT PRODUCT.
            AudioPlayer is constructed as
            `new AudioPlayer(audioType?: AudioContentType, audioUsage?: AudioUsageType)`
            — "Reason for audio playback" — and the enums include
            AudioContentType.CONTENT_TYPE_SPEECH (1) and
            AudioUsageType.USAGE_ACCESSIBILITY (5), documented in the SDK as
            "Audio Usage for Accessibility prompts". The platform anticipates audio
            that speaks over media for accessibility. This does not PROVE concurrency
            — only a device run does — but it moves D2 from a hopeful assumption to
            a documented intent, and it names the construction the runtime test must
            use. A test that constructs the cue player as USAGE_MEDIA would be
            testing the wrong thing and could fail for the right reason.
            (3) THE FALLBACK IS A TYPED API, not a hope. MediaPlayer exposes
            `get audioTracks(): AudioTrackList`, and AudioTrack carries
            `get enabled(): boolean` / `set enabled(enabled: boolean)` with id, kind,
            label and language. decisions.d2_fallback — a pre-mixed second track
            toggled by track switching — is therefore implementable against a real
            interface. D2 failing now costs per-cue granularity and nothing
            architectural.
            STILL OPEN because concurrency is a runtime property: the device test
            remains, and it is now a precise one.'

# =====================================================================
# ALTERNATIVES CONSIDERED
# =====================================================================
alternatives:

  - id: A1
    name: second-screen-companion
    outcome: discarded
    because: 'requires a phone held next to the TV. The product thesis is that the
              television does it alone; ActiView already occupies the phone-synced
              approach.'
    basis: asserted
    depends_on: []
    falsified_by: 'evidence that blind and low-vision viewers prefer a phone-synced
                   track over an on-device one'

  - id: A2
    name: burned-in-description-audio
    outcome: discarded
    because: 'a pre-mixed track has no runtime toggle, no verbosity control and no
              way to skip a cue. It is a file, not a feature.'
    basis: asserted
    depends_on: []
    falsified_by: 'a demo showing per-viewer control over a pre-mixed track'

  - id: A3
    name: subtitle-tts-without-vision
    outcome: discarded
    because: 'reads aloud dialogue that is already audible and says nothing about
              what is on screen during the gaps. No visual information enters the
              system, so it fails the premise and the track priority (computer
              vision) at the same time.'
    basis: asserted
    depends_on: []
    falsified_by: 'a comparison where subtitle-only narration conveys the visual
                   content of a scene'

  - id: A5
    name: non-bedrock-vision-provider
    outcome: open
    because: 'not yet needed. It becomes the plan only if D4 does not clear in time.
              C9 is one function behind one call — up to limits.ad.frames_per_gap_max
              frames plus text in, one bounded description out — so the provider is
              swappable without touching C7, C8, C10 or anything under src/. Polly stays
              either way, which keeps the AWS Builder mini challenge intact
              (decisions.hackathon_track).'
    basis: asserted
    depends_on: [D4]
    falsified_by: 'D4 clearing — a successful Nova invoke on this account returns the
                   plan to Bedrock and closes this entry as discarded'
    note: 'Order of preference if it fires, cheapest first: (1) the hackathon organisers,
           who give $150 of AWS credits and require AWS for a mini challenge and therefore
           have both the interest and the means to unblock a participant who cannot reach
           Bedrock from their country — ask before building anything; (2) an AWS account
           the entrant legitimately holds whose billing country is not restricted;
           (3) another vision provider for C9 only. Option 3 costs the "Bedrock" line in
           the write-up and nothing else that is scored.
           DECIDE BY 09-30, the Phase 1 gate. C9 cannot be written against an unknown
           provider, and Phase 1 closing green before 09-30 is also what would reopen
           C15/C16.'

  - id: A4
    name: fire-os-android-build
    outcome: discarded
    because: 'the rules accept Fire OS or a Vega simulator, and Fire OS is the
              crowded half of the track. Vega is the rarer surface and the one the
              judging team is promoting.'
    basis: asserted
    depends_on: [D3]
    closed: 'R11, 2026-09-22 — D3 held (defects[D3] carries the measurement; this
             entry has none of its own, which is why it stays `asserted`).'
    closed_detail: 'D3 held. The Vega Virtual Device boots on this machine,
             so the rarer surface is reachable and there is no reason to fall back to
             the crowded one. This entry stays discarded unless D3 is reopened by a
             later failure.'
    falsified_by: 'D3 dying — if the Vega simulator stops running here, this entry
                   reopens immediately and becomes the plan. The MediaAdapter seam
                   (02c Phase 7) exists precisely so that reopening costs one
                   directory, and related_docs[R-MULTI-TV] is the reference for it.'

worst_case:
  case: demo-asset
  basis: measured
  evidence: { how: shell, date: 2026-09-22,
              cmd: 'npx tsx pipeline/gaps.ts against assets/tears-of-steel.en.srt (C7, Phase 3 code, unmocked)',
              value: '76 subtitle cues parsed; 67 speech spans after merging 9 overlaps;
                      38 gaps >= 1500 ms; 136.2s dialogue (18.6% of runtime);
                      577.0s describable (78.6% of runtime); 1250 words at standard' }
  asset: 'Tears of Steel (Blender Foundation, CC-BY) — chosen 2026-09-22, see
          decisions.demo_asset_licensing. Subtitles are SRT, not WebVTT; C7 parses
          both because its timestamp regex accepts , and . as the millisecond
          separator. That was written speculatively in Phase 3 and turned out to be
          load-bearing on the first real file.'
  runtime_min: 12.24
  runtime_note: 'MEASURED 2026-09-22 with ffprobe on the real video, replacing the
          assumed 734s of R13: duration 734.166667s, h264 1280x534, AUDIO CODEC MP3
          (not AAC — worth recording, since a player that only accepts AAC in MP4
          would fail here and the failure would look like D2). Source is the 372 MB
          720p .mov from download.blender.org; a 117 MB H.264/AAC MP4 transcode is
          what the device plays. The trailing-gap arithmetic is now exact: dialogue
          ends at 567.0s, the asset runs to 734.17s, so the credits gap is 167.17s.'
  dialogue_pct: 18.6
  describable_pct: 78.6
  gaps_detected: 38
  cues_after_split: 70
  cue_note: 'gaps != cues. 38 gaps become ~70 cues once max_cue_ms splits the long
          ones — 8 of the 38 exceed 12s. Every earlier estimate in this set assumed
          one cue per gap and is therefore low by ~84%.'
  bedrock_calls: 211
  bedrock_calls_note: '70 cues x 3 verbosity levels + 1 dramatis personae pass. The
          figure quoted before R13 was ~121, derived from the wrong 1:1 assumption.'
  est_cost_usd: null
  est_cost_note: 'still null on purpose — blocked by D4, so no call has ever been
          priced. Nova Pro at 211 calls is expected to be low single-digit dollars
          against the 150 of credits, but expected is not measured.'

# =====================================================================
# CONTRACTS — prose JSON blocks must match these field for field.
# =====================================================================
contracts:

  description_track:
    version: string
    asset_id: string
    generated_at: string
    source_subtitles: string
    verbosity: 'concise | standard | detailed'
    model_id: string
    cues: 'array<description_cue>'

  description_cue:
    id: string
    start_ms: int
    end_ms: int
    words: int
    text: string
    audio_uri: string
    source_frames_ms: 'array<int>'
    status: 'ok | failed'

endpoints:
  bedrock_invoke: 'bedrock-runtime.{AWS_REGION}.amazonaws.com InvokeModel'
  polly_synthesize: 'polly.{AWS_REGION}.amazonaws.com SynthesizeSpeech'
  typesafe_systemone: 'api.typesafe.ai/v1/systemone POST (Authorization: Bearer TYPESAFE_API_KEY)'

env_vars: [AWS_REGION, BEDROCK_MODEL_ID, POLLY_VOICE_ID, DEMO_ASSET_PATH, DEMO_SUBTITLES_PATH, TYPESAFE_API_KEY]

# =====================================================================
# VERIFICATION ANCHORS
# =====================================================================
tests_baseline:
  basis: measured
  evidence: { how: shell, cmd: 'npm test', date: 2026-09-22, exit_code: 0,
              value: 'jest: Tests 6 passed, 6 total · vitest: Test Files 1 passed (1), Tests 6 passed (6)',
              note: 'spec 02 Phase 1 + the first test of Phase 2, plus the app
                     suite added in R16. `npm test` runs BOTH runners and fails if
                     either does: jest for the Vega app (test/), vitest for the
                     pipeline (pipeline/__tests__/). The pipeline suite asserts the three
                     verbosity levels are strictly distinct at ten gap sizes and
                     that none exceeds the ceiling (AC17, AC4). Mutation-checked
                     the same day: restoring the R3/R8 scales (standard 1.0,
                     detailed 1.35) turns 2 of the 6 red, so the assertion is a
                     real oracle and not a happy-path pass. `npm run lint`
                     (tsc --noEmit) also exits 0 on the same tree.' }

acceptance:
  - { id: AC1, item: 'the app runs on the Vega simulator and plays the demo asset end to end', status: written }
  - { id: AC2, item: 'every screen state — loading, playing, error, empty — has a focusable element, and BACK during playback has a stated destination', status: written }
  - { id: AC3, item: 'description can be toggled on and off from the remote without interrupting playback', status: written }
  - { id: AC4, item: 'description cues play inside real dialogue gaps and never overlap dialogue', status: written }
  - { id: AC5, item: 'the main track ducks to limits.ad.duck_target_pct during a cue and returns to full afterwards', status: written }
  - { id: AC6, item: 'seeking and held-direction key repeat resync the scheduler without firing a cue per key event', status: written }
  - { id: AC7, item: 'the description track is produced end to end by the pipeline from asset plus subtitles — no cue text is hand-written', status: written }
  - { id: AC8, item: 'a failed or missing track produces a stated visible and spoken state, not silence', status: written }
  - { id: AC9, item: 'the live capture layer, if it ships, is off by default and names where the frame goes before the first send', status: written }
  - { id: AC10, item: 'react-native-tv-audio-description is public, licensed, documented, and has a runnable example, with commits inside the submission window', status: written }
  - { id: AC11, item: 'FRICTION-LOG.md holds dated entries written during the build, not reconstructed at the end', status: written }
  - { id: AC12, item: 'the demo video is under 3 minutes, in English, and shows the app running on the target platform', status: written }
  - { id: AC13, item: 'every Devpost field is submitted before 2026-10-23 12:00 PT, with the primary track and both mini challenges declared', status: written }
  - { id: AC14, item: 'the author watches the demo asset end to end with the description track and rates every cue 1–5 against the picture; track mean and % failed are recorded and the worst cues are regenerated before the demo video is recorded', status: written }
  - { id: AC15, item: 'the control surface is exercised under VoiceView: every control is reachable and announces its state, and the demo video shows it', status: written }
  - { id: AC16, item: 'the submission package cites at least one sourced figure on audio-description coverage; the figure and its source enter the registry before the prose', status: written }
  - { id: AC17, item: 'three verbosity levels (concise/standard/detailed) are selectable from the remote, rescale max_words_per_cue per limits.ad.verbosity_scales, and are demonstrated in the demo', status: written }
  - { id: AC18, item: 'a dramatis personae pass precedes per-gap description and is fed into every C9 prompt alongside rolling context; cue coherence is checked during the AC14 watch', status: written }
  - { id: AC19, item: 'the submission video visualizes the gap structure (timeline strip with dialogue vs gaps + split-screen before/after with ducking) using data from C7', status: written }
  - { id: AC20, item: 'at least one blind/low-vision viewer validates the track before Phase 5 (20–30 min, with/without comparison, consent on file); anonymized quote retained for SUBMISSION.md/video', status: written }
  # AC21 / AC22 were removed on 2026-09-19 (review R5) together with C15/C16.
  # A criterion whose component is deferred is a criterion nothing can satisfy —
  # base gap sweep, §Trimming scope. They return verbatim if
  # decisions.typesafe_judgment_layer.reopens_when fires.

